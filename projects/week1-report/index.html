<!DOCTYPE html>
<!-- 声明文档类型为HTML5，告诉浏览器使用最新的HTML标准来解析页面 -->
<html lang="zh-CN">
<!-- <html>是根元素，lang="zh-CN"表示页面主要使用简体中文，有助于搜索引擎和屏幕阅读器理解页面语言 -->

<head>
    <!-- <head>区域存放页面的元数据（关于页面的信息），不会直接显示在页面上 -->
    <meta charset="UTF-8">
    <!-- 设置字符编码为UTF-8，确保中文字符能正常显示，避免乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 设置视口，让页面在移动设备上也能正常缩放和显示 -->
    <title>安全设备巡检报告</title>
    <!-- <title>定义浏览器标签栏显示的页面标题 -->
</head>

<body>
    <!-- <body>是页面的主体，所有用户能看到的内容都放在这里 -->

    <!-- ==================== header：页眉区域 ==================== -->
    <header>
        <!-- <header>是语义化标签，表示页面或区块的头部，通常包含标题、logo等信息 -->
        <h1>安全设备巡检报告</h1>
        <!-- <h1>是一级标题，整个页面只有一个h1，用于表达页面最核心的主题 -->
        <p>巡检日期：2026-05-04</p>
        <!-- <p>是段落标签，这里用一行文字展示巡检日期 -->
    </header>

    <!-- ==================== nav：导航区域 ==================== -->
    <nav>
        <!-- <nav>是语义化标签，表示导航链接区域，这里用于放置筛选分类占位文字 -->
        <p>全部 | 防火墙 | VPN | 日志审计</p>
        <!-- 纯文字展示筛选占位，用竖线分隔，模拟分类筛选的外观（不包含实际功能） -->
    </nav>

    <!-- ==================== main：主体内容区域 ==================== -->
    <main>
        <!-- <main>是语义化标签，表示页面的核心内容，每个页面只能有一个<main> -->

        <!-- ======== 第一台设备 section ======== -->
        <section>
            <!-- <section>是语义化标签，表示一个独立的内容区块，这里每个section代表一台设备 -->
            <h3>设备名称：核心防火墙-A01</h3>
            <!-- <h3>是三级标题，用于展示设备名称，层级上从属于页面的整体结构 -->

            <table border="1">
                <!-- <table>定义表格，border="1"给表格加上边框线，方便查看表格结构 -->
                <tr>
                    <!-- <tr>表示表格中的一行（table row） -->
                    <th>IP地址</th>
                    <!-- <th>是表头单元格（table header），文字会加粗居中显示 -->
                    <th>设备类型</th>
                    <th>风险等级</th>
                    <th>检查状态</th>
                </tr>
                <tr>
                    <!-- 第二行：数据行 -->
                    <td>192.168.1.1</td>
                    <!-- <td>是普通数据单元格（table data），存放具体数据 -->
                    <td>防火墙</td>
                    <td>高风险</td>
                    <td>已完成</td>
                </tr>
            </table>
        </section>

        <!-- ======== 第二台设备 section ======== -->
        <section>
            <!-- 第二个<section>，代表第二台设备 -->
            <h3>设备名称：分支VPN网关-B02</h3>
            <!-- 用h3展示第二台设备的名称 -->

            <table border="1">
                <!-- 第二个表格，结构与第一个相同 -->
                <tr>
                    <th>IP地址</th>
                    <th>设备类型</th>
                    <th>风险等级</th>
                    <th>检查状态</th>
                </tr>
                <tr>
                    <td>192.168.1.2</td>
                    <td>VPN</td>
                    <td>中风险</td>
                    <td>已完成</td>
                </tr>
            </table>
        </section>

        <!-- ======== 第三台设备 section ======== -->
        <section>
            <!-- 第三个<section>，代表第三台设备 -->
            <h3>设备名称：日志审计平台-C03</h3>
            <!-- 用h3展示第三台设备的名称 -->

            <table border="1">
                <!-- 第三个表格 -->
                <tr>
                    <th>IP地址</th>
                    <th>设备类型</th>
                    <th>风险等级</th>
                    <th>检查状态</th>
                </tr>
                <tr>
                    <td>192.168.1.3</td>
                    <td>日志审计</td>
                    <!-- 设备类型与nav中的"日志审计"筛选类别对应 -->
                    <td>低风险</td>
                    <td>进行中</td>
                    <!-- 第三台设备的检查状态为"进行中"，展示不同状态的示例 -->
                </tr>
            </table>
        </section>

    </main>

    <!-- ==================== footer：页脚区域 ==================== -->
    <footer>
        <!-- <footer>是语义化标签，表示页面或区块的底部，通常包含版权、页码等信息 -->
        <p>共1页</p>
        <!-- 显示页码信息，表示当前报告只有一页 -->
    </footer>

</body>
</html>
